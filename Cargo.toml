[package]
name = "calculadora-coordenadas"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Conversor de coordenadas DD / GMS / UTM (WGS84, SIRGAS 2000, SAD69)"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
